<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Burton Excellence Dashboard</title>

<style>
body{
    margin:0;
    padding:10px;
    background:#00321e;
    color:white;
    font-family:Arial,sans-serif;
    zoom:0.8;
}

.header{
    display:flex;
    justify-content:space-between;
    background:#00472b;
    padding:15px;
    border-left:6px solid #91d6a3;
    border-radius:10px;
}

.card{
    height: 100%;
    min-height: 320px;
    background:#0b442b;
    padding:20px;
    border-radius:14px;
    margin-top:10px;
}

.row{
    display:flex;
    gap:10px;
}

.col{
    flex:1;
}

.tile-row{
    display:flex;
    gap:10px;
}

.tile{
    flex:1;
    background:#145b3b;
    padding:10px;
    text-align:center;
    border-radius:8px;
}

.label{
    color:#bfddca;
    font-size:14px;
}

.value{
    font-size:26px;
    font-weight:bold;
    margin-top:5px;
}

#clock{
    font-size:46px;
    font-weight:bold;
}

.news li{
    margin-bottom:16px;
    font-size:24px;
    line-height:1.4;
    font-weight:bold;
}

.banner{
    margin-top:10px;
    background:#91d6a3;
    color:#00321e;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
    <div>
        <h1>Simon's Control Centre</h1>
        <div>Burton Excellence Office</div>
    </div>

    <div>
        <div id="clock">--:--:--</div>
        <div id="date"></div>
    </div>
</div>

<div class="row">

    <div class="col">
        <div class="card">
            <h2>Today</h2>

            <div class="tile-row">
                <div class="tile">
                    <div class="label">Week</div>
                    <div id="week" class="value">--</div>
                </div>

                <div class="tile">
                    <div class="label">Day</div>
                    <div id="day" class="value">--</div>
                </div>

                <div class="tile">
                    <div class="label">Christmas</div>
                    <div id="christmas" class="value">--</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Fantasy Premier League</h2>

            <div class="tile-row">
                <div class="tile">
                    <div class="label">Total Points</div>
                    <div class="value">624</div>
                </div>

                <div class="tile">
                    <div class="label">Last GW</div>
                    <div class="value">58</div>
                </div>

                <div class="tile">
                    <div class="label">Rank</div>
                    <div class="value">2.1M</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card">
            <h2>BBC Headlines</h2>
            <ul id="news" class="news">
                <li>Loading...</li>
            </ul>
        </div>
    </div>

</div>

<div class="banner">
    Welcome to Burton Excellence Office
</div>

<script>

function pad(n){
    return n<10 ? "0"+n : n;
}

function updateClock(){

    var now = new Date();

    document.getElementById("clock").innerHTML =
        pad(now.getHours()) + ":" +
        pad(now.getMinutes()) + ":" +
        pad(now.getSeconds());

    document.getElementById("date").innerHTML =
        now.toDateString();

    var start = new Date(now.getFullYear(),0,0);

    document.getElementById("day").innerHTML =
        Math.floor((now-start)/86400000);

    var christmas = new Date(now.getFullYear(),11,25);

    document.getElementById("christmas").innerHTML =
        Math.ceil((christmas-now)/86400000);

    var date = new Date(now.getTime());
    date.setHours(0,0,0,0);
    date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));

    var week1 = new Date(date.getFullYear(),0,4);

    document.getElementById("week").innerHTML =
        1 + Math.round(
          ((date.getTime() - week1.getTime()) / 86400000
          - 3 + ((week1.getDay() + 6) % 7)) / 7
        );
}

function loadNews(){

    var url="https://api.rss2json.com/v1/api.json?rss_url="+
            encodeURIComponent("https://feeds.bbci.co.uk/news/rss.xml");

    var req=new XMLHttpRequest();

    req.open("GET",url,true);

    req.onreadystatechange=function(){

        if(req.readyState!==4) return;

        if(req.status===200){

            var data=JSON.parse(req.responseText);
            var html="";

            for(var i=0;i<5;i++){

                html+="<li>"+data.items[i].title+"</li>";

            }

            document.getElementById("news").innerHTML=html;
        }

    };

    req.send();
}

updateClock();
loadNews();

setInterval(updateClock,1000);
setInterval(loadNews,60000);

</script>

</body>
</html>
